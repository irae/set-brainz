<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tracklist</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="player"><div id="yt"></div></div>
<table id="tracklist">
<thead><tr><th>Jump</th><th>Track</th><th>Alternatives</th></tr></thead>
<tbody></tbody>
</table>
<dialog id="track-dialog">
<form method="dialog" id="track-form">
<label>Cue <input type="text" name="cue" placeholder="h:mm:ss"></label>
<label>Artists <input type="text" name="artists"></label>
<label>Title <input type="text" name="title"></label>
<label>Version <input type="text" name="version"></label>
<label>Label <input type="text" name="label"></label>
<label>Link <input type="url" name="link" placeholder="Spotify or YouTube Music URL"></label>
<label><input type="checkbox" name="isId"> Is ID</label>
<label><input type="checkbox" name="isIdVersion"> Is ID remix</label>
<label><input type="checkbox" name="stackedWithPrevious"> Stacked with previous</label>
<label>Note <textarea name="note"></textarea></label>
<menu>
<button type="button" id="track-cancel">Cancel</button>
<button type="submit" value="save">Save</button>
</menu>
</form>
</dialog>
<script src="/vendor/jquery.js"></script>
<script src="/set.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
